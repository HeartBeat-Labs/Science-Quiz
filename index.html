<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC Master Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Global Top Bar for Stats & Focus Mode -->
        <div id="top-bar" class="header-stats">
            <span id="streak-display">🔥 Streak: 0</span>
            <span id="due-today-display">📅 Due: 0</span>
            <button id="focus-toggle-btn" class="icon-btn">🌗 Focus Mode</button>
        </div>

        <!-- Main Subject Menu -->
        <div id="menu-screen" class="screen">
            <div class="level-badge" id="menu-level-badge">Level 1</div>
            <h1 class="glow-text">SSC MASTER</h1>
            
            <!-- Fact Search Engine -->
            <div id="search-container">
                <input type="text" id="fact-search" placeholder="🔍 Search facts (e.g., Turmeric)..." autocomplete="off">
                <div id="search-results-container" class="hidden"></div>
            </div>

            <p>Select your realm to begin.</p>
            <div id="subject-buttons"></div>
        </div>

        <!-- Sub-Menu Screen -->
        <div id="submenu-screen" class="screen hidden">
            <div class="level-badge" id="submenu-level-badge">Level 1</div>
            <h1 class="glow-text" id="submenu-title">Subject</h1>
            <p>Select your training mode.</p>
            <div id="submenu-buttons">
                <!-- Modes (Quick, Standard, Deep, Speed Run, Weakness Realm) injected here -->
            </div>
            <button id="back-to-menu-btn" class="action-btn secondary-btn" style="margin-top: 25px;">⬅ BACK TO REALMS</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen hidden">
            <div class="header">
                <span id="subject-title" class="neon-text">History</span>
                <!-- Exam Speed Run Timer -->
                <span id="timer-display" class="hidden neon-text" style="color: #ff0055;">⏱️ 15s</span>
                <span id="question-counter">1 / 30</span>
            </div>
            
            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>

            <h2 id="question-text">Loading question...</h2>
            
            <div id="options-container"></div>

            <div id="feedback-card" class="hidden">
                <h3 id="feedback-title"></h3>
                <div id="facts-container">
                    <h4 class="neon-text">⚡ Important One-Liners:</h4>
                    <ul id="facts-list"></ul>
                </div>
                
                <!-- Standard Navigation (Wrong Answers or Reviewing) -->
                <div class="nav-buttons" id="standard-nav">
                    <button id="prev-btn" class="action-btn secondary-btn hidden">⬅ PREV</button>
                    <button id="next-btn" class="action-btn">NEXT ➔</button>
                </div>

                <!-- Anki Style Confidence Buttons (Shown on Correct Answers) -->
                <div class="nav-buttons hidden" id="anki-nav">
                    <button id="anki-hard-btn" class="action-btn secondary-btn anki-btn" data-days="2" style="border-color: #ff0055; color: #ff0055;">HARD (2d)</button>
                    <button id="anki-good-btn" class="action-btn secondary-btn anki-btn" data-days="4" style="border-color: #ff8c00; color: #ff8c00;">GOOD (4d)</button>
                    <button id="anki-easy-btn" class="action-btn secondary-btn anki-btn" data-days="7" style="border-color: #00ffcc; color: #00ffcc;">EASY (7d)</button>
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen hidden">
            <h1 class="glow-text">LESSON CLEARED!</h1>
            <h2 id="final-score">Score: 0/30</h2>
            <div id="level-up-msg" class="hidden glow-text" style="color: #00ffcc; margin-bottom: 20px;">🎉 LEVEL UP! 🎉</div>
            
            <button id="review-btn" class="action-btn secondary-btn" style="margin-bottom: 15px;">🔍 REVIEW ANSWERS</button>
            <button id="next-set-btn" class="action-btn">NEXT SET ➔</button>
            
            <p style="text-align: center; margin-top: 20px;">
                <a href="#" onclick="location.reload()" style="color: #94a3b8; text-decoration: none; font-size: 0.9rem;">Change Subject</a>
            </p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
